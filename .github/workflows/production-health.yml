name: Production availability

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/production-health.yml'
      - 'scripts/health-check.mjs'
      - 'tests/health.test.mjs'
      - '.env.production'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test availability checks
        run: node --test tests/health.test.mjs
      - name: Check public app, Google auth and protected database
        run: node scripts/health-check.mjs
